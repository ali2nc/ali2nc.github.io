ame</h1><button class="reset" id="reset" type="button" aria-label="Resetle" title="Resetle"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ><path d="M20 7v5h-5"/><path d="M19.1 12a7.2 7.2 0 1 0-1.8 5.3M20 12l-2.7-4"/></svg></button></div><div class="section">BOYUT</div><div class="modes"><button class="active" data-mode="story"><strong>9:16</strong>Hikâye</button><button data-mode="post"><strong>4:5</strong>Gönderi</button></div><div class="fields"><div><label for="city">KONUM</label><input id="city" type="text" value="Paris" maxlength="30"></div><input id="country" type="hidden" value="France"></div><div id="results" class="results" aria-live="polite"></div><div id="mapstate" class="map-state" role="status">Harita yükleniyor…</div><fieldset class="choice-group"><legend>HARİTA YAKINLIĞI</legend><div class="choices"><label class="choice"><input type="radio" name="zoom" value="10">Geniş alan</label><label class="choice"><input type="radio" name="zoom" value="11" checked>Şehir</label><label class="choice"><input type="radio" name="zoom" value="12">Merkez</label><label class="choice"><input type="radio" name="zoom" value="13">Yakın</label></div></fieldset><div class="section">FOTOĞRAFLAR</div><div id="uploads"></div><fieldset class="choice-group"><legend>DIŞA AKTAR</legend><div class="choices"><label class="choice"><input type="radio" name="format" value="png" checked><strong>PNG</strong><small>En yüksek kalite</small></label><label class="choice"><input type="radio" name="format" value="jpeg"><strong>JPG</strong><small>Daha küçük dosya</small></label></div></fieldset><button class="export" id="download">İNDİR</button><div id="status" role="status"></div></aside><section class="workspace"><div class="toolbar"><span>ÖNİZLEME</span><span class="live">Canlı düzenleme</span></div><div class="frame"><canvas id="canvas" aria-label="Düzenlenen şehir fotoğrafı const $=s=>document.querySelector(s),canvas=$('#canvas'),ctx=canvas.getContext('2d');let mode='story',ready=false;const templates={},defaults=[],photos=[null,null,null],positions=[50,50,50];function load(src){return new Promise((resolve,reject)=>{let im=new Image;im.onload=()=>resolve(im);im.onerror=reject;if(src.startsWith('https:'))im.crossOrigin='anonymous';im.src=src})}
for(let i=0;i<3;i++){let d=document.createElement('div');d.innerHTML=`<label class="upload"><span class="thumb" id="thumb${i}">${i+1}</span><div>${['Ana fotoğraf','Sağ üst fotoğraf','Sağ alt fotoğraf'][i]}<small>Fotoğraf seç · JPG, PNG, WebP</small></div><input type="file" accept="image/*" id="file${i}"></label><div class="adjust" id="adjust${i}"><span>Fotoğrafın dikey konumu</span><button class="remove" id="remove${i}" type="button">Fotoğrafı kaldır</button><input aria-label="${i+1}. fotoğraf dikey konumu" type="range" min="0" max="100" value="50" id="pos${i}"></div>`;$('#uploads').append(d);$('#file'+i).onchange=async e=>{const f=e.target.files[0];if(!f)return;const url=URL.createObjectURL(f);try{photos[i]=await load(url);$('#thumb'+i).innerHTML=`<img style="width:42px;height:42px;object-fit:cover;border-radius:7px" src="${url}">`;$('#adjust'+i).style.display='block';draw()}catch{$('#status').textContent='Fotoğraf açılamadı. Başka bir dosya deneyin.'}};$('#remove'+i).onclick=()=>{photos[i]=null;positions[i]=50;$('#thumb'+i).textContent=i+1;$('#file'+i).value='';$('#pos'+i).value=50;$('#adjust'+i).style.display='none';draw()};$('#pos'+i).oninput=e=>{positions[i]=+e.target.value;draw()}}

let selected={name:'Paris',country:'France',lon:2.3522,lat:48.8566},mapImage=null,mapBusy=false,mapValid=true,mapGeneration=0;const tileCache=new Map();

let mapSeed=crypto.getRandomValues(new Uint32Array(1))[0];function randomMap(){mapSeed=crypto.getRandomValues(new Uint32Array(1))[0]}
function genericMap(){let seed=mapSeed;function rand(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}ctx.fillStyle='#eef0ed';ctx.fillRect(0,0,1179,220);ctx.save();ctx.beginPath();ctx.rect(0,0,1179,220);ctx.clip();ctx.fillStyle='#e1e9df';for(let i=0;i<2;i++){ctx.beginPath();ctx.roundRect(rand()*1150,rand()*190,100+rand()*160,40+rand()*55,18);ctx.fill()}ctx.strokeStyle='#d8e7e9';ctx.lineWidth=22;ctx.beginPath();ctx.moveTo(-60,rand()*220);ctx.bezierCurveTo(300,rand()*320-50,800,rand()*320-50,1240,rand()*220);ctx.stroke();const offset=rand()*160,angle=rand()*100-50;for(let i=-1;i<9;i++){ctx.strokeStyle='#e0e3df';ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(i*170+offset,-80);ctx.lineTo(i*170+offset+angle,300);ctx.stroke();ctx.strokeStyle='#fafbf9';ctx.lineWidth=6;ctx.stroke()}const slope=rand()*120-60;for(let i=0;i<2;i++){ctx.strokeStyle='#e0e3df';ctx.lineWidth=11;ctx.beginPath();ctx.moveTo(0,i*140+offset/2);ctx.lineTo(1200,i*140+offset/2+slope);ctx.stroke();ctx.strokeStyle='#fafbf9';ctx.lineWidth=8;ctx.stroke()}ctx.restore()}
function pin(x,y){ctx.save();ctx.translate(x,y);ctx.fillStyle='#ea4335';ctx.strokeStyle='#ba2921';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,40);ctx.bezierCurveTo(-8,16,-37,-4,-37,-25);ctx.arc(0,-25,37,Math.PI,0);ctx.bezierCurveTo(37,-4,8,16,0,40);ctx.fill();ctx.stroke();ctx.fillStyle='#b82319';ctx.beginPath();ctx.arc(0,-25,14,0,Math.PI*2);ctx.fill();ctx.restore()}
function draw(){if(!ready)return;const story=mode==='story';canvas.width=1080;canvas.height=story?1920:1350;const scale=1080/1179;ctx.save();ctx.scale(scale,scale);ctx.fillStyle='#edf0ee';ctx.fillRect(0,0,1179,story?2096:1474);const sheetY=story?1040:70;

// The card uses a single uniform scale in both formats. No horizontal/vertical stretching.
ctx.save();ctx.beginPath();ctx.roundRect(0,sheetY,1179,2000,90);ctx.clip();ctx.fillStyle='white';ctx.fillRect(0,sheetY,1179,2000);ctx.drawImage(templates.post,0,280,1179,1191,0,sheetY+210,1179,1191);ctx.drawImage(templates.post,735,131,384,96,735,sheetY+61,384,96);box(529,sheetY+24,120,12,6,'#c8c8c8');ctx.restore();ctx.fillStyle='white';ctx.fillRect(55,sheetY+60,655,160);text($('#city').value||'Şehir',60,sheetY+127,640,66,'#202020');text($('#country').value||'',60,sheetY+200,640,43,'#686868');
let bottom=canvas.height/scale-60;let slots=[[60,sheetY+415,768,story?960:bottom-(sheetY+415),56],[852,sheetY+415,450,467,48],[852,sheetY+907,450,story?468:bottom-(sheetY+907),48]];ctx.fillStyle='white';ctx.fillRect(0,sheetY+415,1179,2000);photos.forEach((im,i)=>{if(im||defaults[i])photo(im||defaults[i],...slots[i],im?positions[i]:50)});ctx.restore();$('.frame').style.setProperty('--preview-ratio',story?'0.5625':'0.8');$('.frame').style.aspectRatio=story?'9 / 16':'4 / 5';$('#size').textContent=story?'1080 × 1920 px · 9:16':'1080 × 1350 px · 4:5';$('#download').disabled=story&&(!mapValid||mapBusy||!mapImage)}
async function updateMap(){const gen=++mapGeneration;mapBusy=true;mapImage=null;$('#mapstate').textContent='Seçilen konumun haritası yükleniyor…';draw();const zoom=+$('input[name=zoom]:checked').value,n=2**zoom,tileSize=384,lat=selected.lat*Math.PI/180,cx=(selected.lon+180)/360*n,cy=(1-Math.asinh(Math.tan(lat))/Math.PI)/2*n;const map=document.createElement('canvas');map.width=1179;map.height=1110;const m=map.getContext('2d'),left=cx*tileSize-589.5,top=cy*tileSize-650;let jobs=[];

let searchTimer,searchGeneration=0;async function searchCity(){const q=$('#city').value.trim(),gen=++searchGeneration;$('#results').replaceChildren();if(q.length<2)return;$('#mapstate').textContent='Konumlar aranıyor…';try{const res=await fetch('https://photon.komoot.io/api/?limit=5&q='+encodeURIComponent(q));if(!res.ok)throw Error();const data=await res.json();if(gen!==searchGeneration)return;const features=data.features||[];$('#mapstate').textContent=features.length?'Haritayı güncellemek için konum seçin.':'Konum bulunamadı. Şehir ve ülke adıyla tekrar deneyin.';features.forEach(f=>{const p=f.properties,b=document.createElement('button');b.textContent=[p.name,p.state,p.country].filter(Boolean).join(', ');b.onclick=()=>{selected={name:p.name||q,country:p.country||'',lon:f.geometry.coordinates[0],lat:f.geometry.coordinates[1]};$('#city').value=selected.name;$('#country').value=selected.country;mapValid=true;$('#results').replaceChildren();searchGeneration++;updateMap()};$('#results').append(b)})}catch{if(gen===searchGeneration)$('#mapstate').textContent='Konum araması yapılamadı. Şehir adını tekrar yazıp deneyin.'}}
document.querySelectorAll('input[name=zoom]').forEach(r=>r.onchange=()=>{if(mapValid)updateMap()});
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;if(mode==='post')randomMap();document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));draw()});$('#city').oninput=()=>{mapValid=false;mapGeneration++;mapBusy=false;searchGeneration++;clearTimeout(searchTimer);draw();searchTimer=setTimeout(searchCity,600)};$('#download').onclick=()=>{if(!ready||(mode==='story'&&(!mapValid||mapBusy||!mapImage)))return;if(mode==='post')randomMap();draw();let format=$('input[name=format]:checked').value;canvas.toBlob(blob=>{if(!blob){$('#status').textContent='Görsel oluşturulamadı.';return}let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=`${($('#city').value||'sehir').replace(/[^\p{L}\p{N}-]/gu,'-')}-${mode==='story'?'9x16':'4x5'}.${format==='jpeg'?'jpg':'png'}`;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);$('#status').textContent='Görsel indirilmeye hazır.'},'image/'+format,.96)};$('#reset').onclick=()=>{photos.fill(null);positions.fill(50);$('#city').value='Paris';$('#country').value='France';for(let i=0;i<3;i++){$('#thumb'+i).textContent=i+1;$('#file'+i).value='';$('#adjust'+i).style.display='none';$('#pos'+i).value=50}$('#status').textContent='';clearTimeout(searchTimer);searchGeneration++;$('#results').replaceChildren();selected={name:'Paris',country:'France',lon:2.3522,lat:48.8566};mapValid=true;$('input[name=zoom][value="11"]').checked=true;updateMap();draw()};Promise.all(['story','post'].map(async k=>templates[k]=await load('assets/'+k+'.png'))).then(()=>{[[60,485,768,960],[852,485,450,467],[852,977,450,468]].forEach(([x,y,w,h])=>{const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(templates.post,x,y,w,h,0,0,w,h);defaults.push(c)});ready=true;draw();updateMap()}).catch(()=>$('#status').textContent='Şablon yüklenemedi. Sayfayı yenileyin.');
